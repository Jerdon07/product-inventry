<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Brand-colored rounded tile (matches --color-primary) -->
    <rect width="64" height="64" rx="14" fill="#8e51ff"/>

    <!-- Isometric box: top face, left face, right face (shaded for depth) -->
